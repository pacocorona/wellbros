# Wellbros — proxy inverso en Debian 13
#
# Instalación:
#   sudo cp deploy/nginx/wellbros.conf /etc/nginx/sites-available/wellbros.conf
#   sudo ln -s /etc/nginx/sites-available/wellbros.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wellbrosproperties.lat -d www.wellbrosproperties.lat --redirect
#
# Certbot reescribe este archivo para añadir el bloque 443 y la redirección
# desde el 80. HTTPS no es opcional: sin él el navegador no registra el service
# worker ni ofrece instalar la aplicación en el teléfono.

# Límite de intentos de inicio de sesión: 5 por minuto por IP.
# Va fuera del server (contexto http) — si nginx se queja de directiva
# duplicada, mueve esta línea a /etc/nginx/conf.d/wellbros-limits.conf
limit_req_zone $binary_remote_addr zone=wellbros_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wellbrosproperties.lat www.wellbrosproperties.lat;

    # Los correos y las cesiones no llevan adjuntos; 2 MB sobra y acota el riesgo.
    client_max_body_size 2m;

    # No revelar la versión de nginx.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Estáticos con huella de contenido: cache agresivo e inmutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El service worker NUNCA se cachea: si se congela, los usuarios se quedan
    # con una versión vieja de la aplicación sin manera de actualizarla.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Freno a la fuerza bruta contra el inicio de sesión.
    location /api/auth/login {
        limit_req zone=wellbros_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flujo de eventos del calendario en vivo (SSE): sin buffering, sin timeout
    # corto, o nginx cortaría la conexión cada minuto.
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
