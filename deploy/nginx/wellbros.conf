# Puerto de la aplicación en UN SOLO SITIO. Debe coincidir con PORT del
# archivo /srv/wellbros/shared/.env: si no coinciden, nginx devuelve 502.
# En un servidor compartido el 3000 puede estar ocupado por otra aplicación.
map $host $wellbros_app { default "127.0.0.1:3000"; }

# Wellbros — proxy inverso en Debian 13
#
# Instalación:
#   cp deploy/nginx/wellbros.conf /etc/nginx/sites-available/wellbros.conf
#   ln -s /etc/nginx/sites-available/wellbros.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d wellbrosproperties.lat -d www.wellbrosproperties.lat --redirect
#
# Certbot reescribe este archivo para añadir el bloque 443 y la redirección
# desde el 80. Por eso aquí solo va el 80: escribir el 443 a mano antes de que
# exista el certificado impide que nginx arranque.
#
# HTTPS NO ES OPCIONAL, Y LA RAZÓN ES ESTA: la cookie de sesión se emite con
# `secure: true` en producción (src/lib/auth/session.ts, sessionCookieOptions).
# Una cookie `secure` no viaja por HTTP, así que el navegador la descarta y
# NADIE PUEDE INICIAR SESIÓN: se ve la pantalla de acceso, se escribe la
# contraseña correcta y la aplicación devuelve a /login una y otra vez, sin
# ningún mensaje de error que explique nada. Hasta que certbot termine, el
# sitio está cerrado en la práctica.

# ───────────────────────────────────────────── límite de intentos de acceso
#
# El inicio de sesión NO es una ruta de API: es una Server Action de Next, que
# viaja como POST a la propia página /login con la cabecera `Next-Action`. Por
# eso el límite va sobre `location = /login`. Una regla sobre /api/auth/login
# —como la que había aquí— no protege nada, porque esa ruta no existe.
#
# Se cuentan SOLO los POST. Cuando la clave sale vacía, nginx no contabiliza la
# petición: así recargar la pantalla de acceso (GET) no gasta cupo y quien se
# equivoca de contraseña no queda castigado por volver a la página.
map $request_method $wellbros_login_key {
    default "";
    POST    $binary_remote_addr;
}

# 5 intentos por minuto y por IP, con margen de 5 seguidos.
# Va en el contexto http, que es donde se incluye este archivo. Si nginx se
# queja de directiva duplicada, es que el archivo está incluido dos veces
# (típico: una copia en sites-enabled y otra en conf.d).
#
# OJO CON EL NAT: quienes salen a internet por la misma IP comparten cupo. 5
# por minuto sobra para el uso real, pero si alguien avisa de "me dice que hay
# demasiados intentos y no he probado nada", la causa es esta.
limit_req_zone $wellbros_login_key zone=wellbros_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wellbrosproperties.lat www.wellbrosproperties.lat;

    # Los correos y las cesiones no llevan adjuntos; 2 MB sobra y acota el riesgo.
    client_max_body_size 2m;

    # No revelar la versión de nginx.
    server_tokens off;

    # ─────────────────────────────────────────────── cabeceras de seguridad
    #
    # REGLA DE NGINX QUE HAY QUE TENER PRESENTE AL EDITAR ESTE ARCHIVO:
    # `add_header` NO se hereda por acumulación. Un `location` que declare UNA
    # sola cabecera propia pierde LAS TRES de aquí. Si algún bloque necesita
    # una cabecera, hay que repetir estas tres dentro de él (ver el ejemplo
    # comentado de /sw.js al final).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS — NO ACTIVAR TODAVÍA.
    # Descomentar SOLO cuando certbot haya emitido el certificado y
    # https://wellbrosproperties.lat cargue de verdad. Esta cabecera ordena al
    # navegador no volver a hablar por HTTP con este dominio durante un año, y
    # la orden queda guardada EN EL NAVEGADOR: enviada antes de tener
    # certificado válido, deja el sitio inaccesible para quien ya la recibió y
    # no hay forma de retirarla desde el servidor. Al activarla, va en el
    # bloque 443 que escribe certbot (por HTTP los navegadores la ignoran) y
    # hay que repetirla en todo location que declare add_header.
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ───────────────────────────────────────────────────────────── estáticos
    #
    # Este bloque NO declara ningún `add_header`, y es a propósito:
    #   1. Next ya envía `Cache-Control: public, max-age=31536000, immutable`
    #      en /_next/static/ (los nombres llevan huella de contenido).
    #      Declararlo aquí mandaba la cabecera DOS veces.
    #   2. Al no declarar ninguna, este location conserva las tres cabeceras de
    #      seguridad del bloque padre. En cuanto se declare una, se pierden las
    #      tres y hay que copiarlas aquí.
    location /_next/static/ {
        proxy_pass http://$wellbros_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ───────────────────────────────────────────── freno al inicio de sesión
    #
    # Coincidencia exacta (`=`): solo la página de acceso.
    # 429 y no el 503 por defecto: un 503 significa "servidor no disponible",
    # así que los monitores darían el sitio por caído y el navegador insistiría.
    # 429 dice exactamente lo que pasa: vas demasiado rápido.
    location = /login {
        limit_req zone=wellbros_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://$wellbros_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$wellbros_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ═════════════════════════════════════════════════════════════════════
    # FASE 3 — ACTIVA. Las dos rutas ya existen en la aplicación.
    #
    # Estuvieron comentadas mientras apuntaban a rutas inexistentes. Ya no:
    # se implementaron el calendario en vivo y la PWA, así que los dos bloques
    # vuelven a hacer falta. Requieren `nginx -t && systemctl reload nginx`
    # para surtir efecto: hasta ese reload el servidor sigue con la config
    # vieja y los dos síntomas de abajo se ven en producción.

    # (a) Eventos en vivo del calendario (SSE) — src/app/api/events/route.ts.
    #
    #     SIN ESTE BLOQUE EL CALENDARIO PARECE MUERTO AUNQUE EL CÓDIGO ESTÉ
    #     BIEN: `proxy_buffering` retiene el flujo hasta llenar un búfer que un
    #     goteo de eventos no llena nunca, y el `proxy_read_timeout 60s` del
    #     bloque general corta la conexión cada minuto. La ruta ya manda
    #     `X-Accel-Buffering: no`, que cubre lo primero pero NO el timeout.
    location /api/events {
        proxy_pass http://$wellbros_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # (b) Service worker de la PWA — public/sw.js.
    #
    #     Next lo sirve con `Cache-Control: public, max-age=0` y sin `no-store`
    #     una caché intermedia puede congelarlo: los navegadores seguirían
    #     ejecutando esa versión para siempre y no habría forma de corregirlo
    #     desde el servidor. El registro usa `updateViaCache: "none"`, que es la
    #     otra mitad del cinturón.
    #
    #     OJO: este bloque declara `add_header`, y eso DESCARTA los heredados
    #     del bloque padre. Por eso repite las tres cabeceras de seguridad; si
    #     tocas una arriba, tócala también aquí.
    location = /sw.js {
        proxy_pass http://$wellbros_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # ═════════════════════════════════════════════════════════════════════
}
